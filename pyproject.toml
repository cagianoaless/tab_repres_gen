[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "relational-tfm-study"
version = "0.1.0"
description = "Scientific artifact for Graph-to-Table Interfaces Control Relational Generalisation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "networkx==3.5",
  "numpy==2.2.6",
  "pandas==2.3.1",
  "pyyaml==6.0.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.0",
]

[project.optional-dependencies]
tree = [
  "catboost==1.2.8",
]
tfm = [
  "tabpfn==8.1.0",
]
cluster = [
  "kubejobs==0.4.8",
]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]
plots = [
  "plotnine==0.15.7",
]

[project.scripts]
rtfm = "relational_tfm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relational_tfm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
